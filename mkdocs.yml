site_name: MSK Fellowship Manual
site_description: University of Wisconsin – Madison | Musculoskeletal Imaging and Intervention Fellowship
site_url: ""
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.highlight
    - search.share
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - content.tooltips
  font:
    text: Source Sans Pro
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Daily Operations:
    - Daily Workflow: daily-workflow.md
    - Communication: communication.md
  - Clinical Rotations:
    - Procedures at UH: procedures-uh.md
  - On Call:
    - Taking Call: taking-call.md
  - Schedule & Time Off:
    - Time Off Requests: time-off.md
    - Conference Dates: conferences.md

extra:
  generator: false
  social:
    - icon: fontawesome/solid/hospital
      link: https://www.radiology.wisc.edu
      name: UW Radiology

extra_css:
  - stylesheets/extra.css
